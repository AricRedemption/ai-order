name: reviewer-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  reviewer-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate reviewer payload
        run: |
          if [ ! -f .github/reviewer-result.json ]; then
            echo "missing .github/reviewer-result.json"
            exit 1
          fi
          bash scripts/ci/reviewer-gate.sh --input .github/reviewer-result.json
